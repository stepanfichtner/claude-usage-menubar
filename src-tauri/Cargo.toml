[package]
name = "claude-usage-menubar"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Menu bar monitor for Claude subscription usage limits"
license = "MIT"

[lib]
name = "claude_usage_menubar"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.4"
tauri-plugin-store = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-positioner = { version = "2.3", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
dirs = "7"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# Enables `tauri::test` (MockRuntime) for settings::tests only. Dev-dependency
# feature unification means this never reaches the shipped binary — `cargo
# build --release` does not pull in dev-dependencies at all.
tauri = { version = "2.11", features = ["test"] }
