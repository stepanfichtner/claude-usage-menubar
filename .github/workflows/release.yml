name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Refuse tags that are not on main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is on main."
          else
            echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main. Releases are cut from main only."
            exit 1
          fi

      - name: Refuse a tag that disagrees with Cargo.toml
        run: |
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CARGO" = "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME matches Cargo.toml ($CARGO)."
          else
            echo "::error::tag $GITHUB_REF_NAME says $TAG, Cargo.toml says $CARGO"
            exit 1
          fi

  # macOS bundling has a known ~6% flake: `pnpm tauri build` can fail partway
  # through, after the .app is already built, with a Finder/AppleScript error
  # from the vendored `create-dmg` step (something like `Can't get disk ...
  # (-1728)`). Root cause: that script styles the mounted disk image's window
  # with `osascript` and occasionally runs it before Finder has caught up
  # with the just-attached volume — a race in `create-dmg`, not in this
  # project's code (see README's "If the DMG step fails"). It affects only
  # the human-facing .dmg; the updater fetches the .app.tar.gz + signature,
  # never the .dmg, so this can never break an update. If the macOS job goes
  # red here, re-run just that job — it is not a regression.
  # Linux is built and tested on every push by ci.yml, but no one has run it
  # on real hardware yet, so 0.1.0 ships macOS only. The leg comes back once
  # the Ubuntu verification passes — see the README's Ubuntu section.
  build:
    needs: guard
    # The only job in either workflow that needs a write token: it creates the
    # draft release and uploads the bundles. `guard` runs on the workflow-level
    # read-only token.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Spec §13.2: no hand-maintained changelog. `${GITHUB_REF_NAME}^` is the
      # parent of the just-pushed tag's commit, so this names the tag before
      # it in the tag's own ancestry rather than just the newest other tag —
      # right even with tags out of creation order. On the very first release
      # that parent has no reachable tag at all, `git describe` fails, and
      # `|| true` (with `set -e` in effect on this shell) turns that into an
      # empty PREVIOUS_TAG rather than a failed step; RANGE then falls back to
      # the tag alone, i.e. the whole history up to it.
      - name: Generate release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
          fi
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' \
            | grep -E '^- (feat|fix)(\([^)]*\))?:' || true)
          {
            echo "notes<<NOTES_EOF"
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "No feat/fix commits since the previous release."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Every `uses:` above is pinned to a full commit SHA because of the three
      # lines below. This step hands minisign's private key — the app's entire
      # and permanent trust root — plus a `contents: write` token to
      # third-party code. Against a mutable tag or branch ref, whoever controls
      # that action can repoint it at new code at any time
      # (tj-actions/changed-files, March 2025) and that code would run here,
      # able to sign a malicious .app.tar.gz that every installed updater
      # accepts as genuine. `releaseDraft: true` does not help: the token can
      # publish. Do not tidy these SHAs back to tags. Bump them one at a time,
      # deliberately, after reading the diff.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Usage ${{ github.ref_name }}
          releaseBody: |
            Unsigned builds. On macOS, right-click the app and choose Open, or run
            `xattr -dr com.apple.quarantine "/Applications/Claude Usage.app"`.

            ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
