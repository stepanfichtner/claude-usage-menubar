name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse tags that are not on main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is on main."
          else
            echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main. Releases are cut from main only."
            exit 1
          fi

      - name: Refuse a tag that disagrees with Cargo.toml
        run: |
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CARGO" = "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME matches Cargo.toml ($CARGO)."
          else
            echo "::error::tag $GITHUB_REF_NAME says $TAG, Cargo.toml says $CARGO"
            exit 1
          fi

  # macOS bundling has a known ~6% flake: `pnpm tauri build` can fail partway
  # through, after the .app is already built, with a Finder/AppleScript error
  # from the vendored `create-dmg` step (something like `Can't get disk ...
  # (-1728)`). Root cause: that script styles the mounted disk image's window
  # with `osascript` and occasionally runs it before Finder has caught up
  # with the just-attached volume — a race in `create-dmg`, not in this
  # project's code (see README's "If the DMG step fails"). It affects only
  # the human-facing .dmg; the updater fetches the .app.tar.gz + signature,
  # never the .dmg, so this can never break an update. If the macOS job goes
  # red here, re-run just that job — it is not a regression.
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Spec §13.2: no hand-maintained changelog. `${GITHUB_REF_NAME}^` is the
      # parent of the just-pushed tag's commit, so this names the tag before
      # it in the tag's own ancestry rather than just the newest other tag —
      # right even with tags out of creation order. On the very first release
      # that parent has no reachable tag at all, `git describe` fails, and
      # `|| true` (with `set -e` in effect on this shell) turns that into an
      # empty PREVIOUS_TAG rather than a failed step; RANGE then falls back to
      # the tag alone, i.e. the whole history up to it.
      - name: Generate release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
          fi
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' \
            | grep -E '^- (feat|fix)(\([^)]*\))?:' || true)
          {
            echo "notes<<NOTES_EOF"
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "No feat/fix commits since the previous release."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Usage ${{ github.ref_name }}
          releaseBody: |
            Unsigned builds. On macOS, right-click the app and choose Open, or run
            `xattr -dr com.apple.quarantine "/Applications/Claude Usage.app"`.

            ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
