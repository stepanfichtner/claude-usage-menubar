name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Refuse tags that are not on main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is on main."
          else
            echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main. Releases are cut from main only."
            exit 1
          fi

      - name: Refuse a tag that disagrees with Cargo.toml
        run: |
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CARGO" = "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME matches Cargo.toml ($CARGO)."
          else
            echo "::error::tag $GITHUB_REF_NAME says $TAG, Cargo.toml says $CARGO"
            exit 1
          fi

  # macOS bundling has a known ~6% flake: `pnpm tauri build` can fail partway
  # through, after the .app is already built, with a Finder/AppleScript error
  # from the vendored `create-dmg` step (something like `Can't get disk ...
  # (-1728)`). Root cause: that script styles the mounted disk image's window
  # with `osascript` and occasionally runs it before Finder has caught up
  # with the just-attached volume — a race in `create-dmg`, not in this
  # project's code (see README's "If the DMG step fails"). It affects only
  # the human-facing .dmg; the updater fetches the .app.tar.gz + signature,
  # never the .dmg, so this can never break an update. If the macOS job goes
  # red here, re-run just that job — it is not a regression.
  # The ubuntu-22.04 leg produces artifacts; it does not verify them. ci.yml
  # has always compiled this code and run its tests on Ubuntu, but nobody has
  # launched the result on real hardware, and the Linux credential path
  # (`~/.claude/.credentials.json`) is still an unconfirmed assumption — if it
  # is wrong the app cannot sign in at all. The leg is here so the first person
  # to try Linux has something to install and report back on, not because Linux
  # is supported. The README's Ubuntu section tells whoever downloads it the
  # same thing, and the two are meant to stay in step.
  #
  # One consequence to watch on the first run: `bundle.targets` in
  # tauri.conf.json is global, so the macOS leg now requests `deb` and
  # `appimage` too. The bundler is expected to intersect the requested targets
  # with what the host platform can actually produce, which is not something
  # this checkout can prove. `fail-fast: false` is what makes that safe to find
  # out: if macOS trips over it, the Ubuntu leg still finishes and uploads. If
  # it does trip, split `targets` per platform rather than dropping either leg.
  build:
    needs: guard
    # The only job in either workflow that needs a write token: it creates the
    # draft release and uploads the bundles. `guard` runs on the workflow-level
    # read-only token.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Same list as ci.yml's Ubuntu job, and for the same reason: webkit2gtk
      # and libayatana-appindicator are what the app links against, and
      # patchelf/librsvg/file/wget are what the AppImage bundler shells out to.
      # No `uses:` here on purpose — plain apt-get needs no third-party action,
      # so this step adds nothing new to pin.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch head, 2026-09-03
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Spec §13.2: no hand-maintained changelog. `${GITHUB_REF_NAME}^` is the
      # parent of the just-pushed tag's commit, so this names the tag before
      # it in the tag's own ancestry rather than just the newest other tag —
      # right even with tags out of creation order. On the very first release
      # that parent has no reachable tag at all, `git describe` fails, and
      # `|| true` (with `set -e` in effect on this shell) turns that into an
      # empty PREVIOUS_TAG rather than a failed step; RANGE then falls back to
      # the tag alone, i.e. the whole history up to it.
      - name: Generate release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
          fi
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' \
            | grep -E '^- (feat|fix)(\([^)]*\))?:' || true)
          {
            echo "notes<<NOTES_EOF"
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "No feat/fix commits since the previous release."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Every `uses:` above is pinned to a full commit SHA because of the three
      # lines below. This step hands minisign's private key — the app's entire
      # and permanent trust root — plus a `contents: write` token to
      # third-party code. Against a mutable tag or branch ref, whoever controls
      # that action can repoint it at new code at any time
      # (tj-actions/changed-files, March 2025) and that code would run here,
      # able to sign a malicious .app.tar.gz that every installed updater
      # accepts as genuine. `releaseDraft: true` does not help: the token can
      # publish. Do not tidy these SHAs back to tags. Bump them one at a time,
      # deliberately, after reading the diff.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Claude Usage ${{ github.ref_name }}
          # Someone can land on this page without ever seeing the README, so
          # the Linux hedge has to travel with the artifacts rather than only
          # live in the repo. SHA-256 lines are appended to this body by the
          # `checksums` job once both legs have uploaded.
          releaseBody: |
            Unsigned builds. On macOS, right-click the app and choose Open, or run
            `xattr -dr com.apple.quarantine "/Applications/Claude Usage.app"`.

            **Linux — please read before installing.** The `.AppImage` and `.deb`
            here have never been run on real hardware by anyone. Prefer the
            AppImage: `chmod +x` it and run it, and the in-app updater replaces it
            in place. The `.deb` installs updates through `pkexec`, so it asks for
            your password every time. The app reads `~/.claude/.credentials.json`
            on Linux and that path is unconfirmed — if it is wrong, sign-in fails
            outright. See the README's Ubuntu section, and please report back.

            ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The README tells readers to verify their download against a SHA-256 in the
  # release notes. Until this job existed that was simply false — nothing
  # emitted checksums and no manual step was written down anywhere. For an
  # unsigned binary the checksum is the only thing a downloader can actually
  # check, so the fix is to make the sentence true rather than to delete it.
  #
  # A separate job, not a step inside `build`, because `build` is a matrix of
  # two: appending to the release body from both legs at once is a
  # read-modify-write race, and the loser's checksums vanish silently. `needs:
  # build` makes this the single writer, after every artifact is uploaded.
  #
  # It hashes the assets **downloaded back from the release**, not the local
  # build output, so what is published describes the exact bytes a user gets.
  #
  # This is the second job holding `contents: write`, which was previously true
  # of `build` alone — editing a release body cannot be done with a read-only
  # token. It is a deliberately small widening: this job checks out no code,
  # uses no third-party action (so it adds nothing to pin), and is never given
  # the signing key. Keep it that way.
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Append SHA-256 checksums to the release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cd "$workdir"

          # Drafts are reachable by tag here because the tag push is what
          # triggered this workflow, so the ref already exists.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"

          if [ -z "$(ls -A)" ]; then
            echo "::error::no release assets found for $TAG — refusing to publish an empty checksum block"
            exit 1
          fi

          SUMS=$(sha256sum * | sort -k2)
          echo "$SUMS"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md

          # Idempotent: a re-run (the macOS leg has a known create-dmg flake and
          # gets re-run by hand) must replace the previous block, not stack a
          # second one under it. First awk drops everything from our own marker
          # onward; second drops trailing blank lines, without which each re-run
          # would leave one more of them behind. Deliberately not `sed -i`: that
          # needs an argument on BSD and none on GNU, and this was written on a
          # Mac. Verified by running the pair four times over its own output —
          # one block, one blank line, byte-identical every time.
          awk '/^## SHA-256$/{exit} {print}' body.md \
            | awk 'NF{while(b>0){print "";b--} print; next} {b++}' > trimmed.md

          {
            cat trimmed.md
            printf '\n## SHA-256\n\n```\n%s\n```\n' "$SUMS"
          } > new-body.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file new-body.md
